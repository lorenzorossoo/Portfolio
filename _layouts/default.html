<!DOCTYPE html>
<html lang="it"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#141214">
<title>{{ page.title | escape }}{% if page.title %} | {% endif %}Rouge Lab</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}">
{% if page.noindex %}<meta name="robots" content="noindex,follow">{% endif %}
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/fonts.css' | relative_url }}">
<link rel="icon" href="{{ '/assets/homePage/favicon.jpg' | relative_url }}">
<meta property="og:site_name" content="Rouge Lab"><meta property="og:title" content="{{ page.title | default: site.title | escape }} | Rouge Lab">
<meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}">
<meta property="og:image" content="{{ '/assets/homePage/logo.jpg' | absolute_url }}"><meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="{{ '/assets/homePage/logo.jpg' | absolute_url }}"><meta name="author" content="Lorenzo Rosso">
</head><body>
<a class="skip-link" href="#main-content">Vai al contenuto</a>
<header class="navbar"><div class="nav-inner">
 <a href="{{ '/' | relative_url }}" class="logo" aria-label="Rouge Lab — Home"><span class="accent">Rouge</span> Lab<span class="brand-dot" aria-hidden="true">.</span></a>
 <nav aria-label="Navigazione principale"><ul class="nav-links" id="primary-menu">
 <li class="mobile-only"><a href="{{ '/' | relative_url }}">Home</a></li>
 <li><a href="{{ '/#chi-sono' | relative_url }}">Chi sono</a></li><li><a href="{{ '/#servizi' | relative_url }}">Servizi</a></li>
 <li><a href="{{ '/blog/' | relative_url }}">Blog</a></li><li><a href="{{ '/#contatti' | relative_url }}" class="btn-nav">Contattami <span aria-hidden="true">↗</span></a></li>
 </ul></nav>
 <button class="menu-toggle" aria-label="Apri menu" aria-expanded="false" aria-controls="primary-menu"><span></span><span></span><span></span></button>
</div></header>
<main id="main-content" tabindex="-1">{{ content }}</main>
<footer class="footer"><div class="container footer-inner"><a href="{{ '/' | relative_url }}" class="logo"><span class="accent">Rouge</span> Lab.</a><div>
<p>&copy; {{ site.time | date: '%Y' }} Lorenzo Rosso – Chinesiologo. Tutti i diritti riservati.</p><a href="{{ '/privacy/' | relative_url }}">Privacy e cookie</a></div></div></footer>
<script src="{{ '/script.js' | relative_url }}" defer></script></body></html>
