---
layout: default
---
<section class="section article-section">
  <div class="container article-container">
    <a href="{{ '/blog/' | relative_url }}" class="back-link">&larr; Torna al blog</a>

    <div class="article-header">
      <p class="article-meta">{{ page.date | date: "%d.%m.%Y" }}</p>
      <h1>{{ page.title }}</h1>
    </div>

    <div class="article-body">
      {{ content }}
    </div>

    <a href="{{ '/blog/' | relative_url }}" class="back-link">&larr; Torna al blog</a>
  </div>
</section>
