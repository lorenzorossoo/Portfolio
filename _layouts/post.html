---
layout: default
---
<section class="section" style="padding-top: 70px;">
  <div class="container" style="max-width: 700px;">
    <a href="{{ '/blog.html' | relative_url }}" class="back-link">&larr; Torna al blog</a>

    <div class="article-header">
      <p class="article-meta">{{ page.date | date: "%B %Y" }}</p>
      <h1>{{ page.title }}</h1>
    </div>

    <div class="article-body">
      {{ content }}
    </div>

    <a href="{{ '/blog.html' | relative_url }}" class="back-link">&larr; Torna al blog</a>
  </div>
</section>
